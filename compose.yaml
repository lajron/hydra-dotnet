services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: HydraTemplate
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: hydra_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d HydraTemplate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
